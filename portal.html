</style></head><body><div class="wrap">
<div class="brand"><img src="./logo.jpg" alt=""><div><b>Açaí Obrigatório</b><span>Meu portal</span></div></div>
<div id="app"><div class="sk" style="height:36px;width:62%"></div><div class="sk" style="height:210px"></div><div class="sk"></div><div class="sk"></div></div>

<script>
const API='https://script.google.com/macros/s/AKfycbw4RDHwWKWwhuBCXCb98lGfx3C2ac2yX1YwzqXQXlXivmhPgcOIQbXVigZH0B4wsWED/exec';
const WA='5519996119345';
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function code(c){const b=String(c.cardToken||'')+'|'+String(c.cardUpdatedAt||'')+'|'+String(c.points||0)+'|'+String(c.rewards||0);let h=0;for(let i=0;i<b.length;i++)h=((h<<5)-h)+b.charCodeAt(i),h|=0;return Math.abs(h).toString(36).toUpperCase().slice(0,6).padStart(6,'0')}
function fail(t,m){$('app').innerHTML='<div class="state"><b style="color:var(--ink);font-size:18px">'+t+'</b><p>'+m+'</p></div>'}
function render(d){
 const target=Math.max(1,+d.target||10),pts=Math.max(0,+d.points||0),pct=Math.min(100,(pts%target)/target*100),up=d.cardUpdatedAt?new Date(d.cardUpdatedAt):null;
 const open=(d.orders||[]).reduce((s,o)=>s+(+o.pending||0),0);
 const card=`<div class="loyaltyCard"><div class="brandline"><div><div style="font-size:12px;letter-spacing:2px">AÇAÍ OBRIGATÓRIO</div><h2 style="margin:5px 0;color:#fff">Clube Obrigatório</h2><div class="muted">Cartão fidelidade digital</div></div><div style="width:66px;height:66px;border-radius:14px;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;overflow:hidden"><img src="./logo.jpg" alt="" style="width:58px;height:58px;object-fit:contain;border-radius:10px"></div></div><div style="margin-top:18px">Olá, ${esc(d.name)}!</div><div class="points">${pts} <span style="font-size:15px">pontos</span></div><div class="muted">${Math.max(0,target-pts%target)} ponto(s) para a próxima recompensa</div><div style="background:#ffffff3b;height:8px;border-radius:99px;margin-top:14px;overflow:hidden"><div style="background:#f8e76b;height:100%;width:${pct}%"></div></div><div style="margin-top:15px;font-weight:750">🎁 ${esc(d.reward)} · ${+d.rewards||0} disponível(is)</div><div class="muted" style="margin-top:12px;font-size:12px">Código de validação: ${code(d)}<br>Última atualização: ${up&&!isNaN(up)?up.toLocaleString('pt-BR'):'Sem movimentação registrada'}</div></div>`;
 const banner=open>0?`<div class="banner warn">Você tem ${money(open)} em aberto. <a style="color:inherit;text-decoration:underline" href="https://wa.me/'+WA+'" target="_blank" rel="noopener">Chame no WhatsApp</a> para acertar.</div>`:`<div class="banner">Tudo em dia, nenhum valor em aberto.</div>`;
 const list=(d.orders||[]).map(o=>{const dt=new Date(o.date),st=o.pending<=0?'Pago':(o.pending<o.total?'Parcial':'Em aberto');return `<details class="order"><summary><div><b>Pedido #${String(o.id).padStart(4,'0')}</b><small>${isNaN(dt)?'':dt.toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'})} · ${o.items} item(ns)</small><span class="tag ${st==='Pago'?'':'warn'}">${st}</span></div><b>${money(o.total)}</b></summary><div class="det">${(o.lines||[]).map(l=>'• '+esc(l)).join('<br>')||'Sem detalhes'}</div></details>`}).join('')||'<div class="state">Você ainda não fez pedidos por aqui. Que tal começar agora?</div>';
 const h=new Date().getHours(),hi=h<12?'Bom dia':h<18?'Boa tarde':'Boa noite',first=esc(String(d.name||'').trim().split(/\s+/)[0]),left=Math.max(0,target-pts%target);
 const wa='https://wa.me/'+WA+'?text='+encodeURIComponent('Olá! Aqui é '+d.name+', estou falando pelo portal do Açaí Obrigatório.');
 const hero=`<div class="hello"><h1>${hi}, ${first}! <span class="wave">👋</span></h1><p>Que bom ter você por aqui. O que vai ser hoje?</p></div>`;
 const tip=(+d.rewards||0)>0?`<div class="tip">🎉 Você tem <b>${+d.rewards} recompensa(s)</b> para resgatar: ${esc(d.reward)}. É só avisar no próximo pedido!</div>`:`<div class="tip">⭐ Faltam só <b>${left} ponto(s)</b> para você ganhar ${esc(d.reward)}.</div>`;
 const acts=`<div class="acts"><button class="go" onclick="openOrder()">🛒 Fazer pedido</button><a class="wa" href="${wa}" target="_blank" rel="noopener">💬 WhatsApp</a></div>`;
 $('app').innerHTML=hero+card+tip+acts+'<div id="orderBox"></div><div id="quotesBox"></div>'+banner+'<h2>Meus pedidos</h2>'+list;loadQuotes();prefetchProducts();
}
const TOKEN=new URLSearchParams(location.search).get('t')||'';
function call(q){return new Promise((ok,no)=>{const cb='__pc'+Date.now()+Math.random().toString(36).slice(2),s=document.createElement('script');let d=false;const end=()=>{d=true;try{delete window[cb];s.remove()}catch(e){}};window[cb]=x=>{end();ok(x)};s.onerror=()=>{end();no()};s.src=API+'?'+q+'&token='+encodeURIComponent(TOKEN)+'&callback='+cb+'&t='+Date.now();document.body.appendChild(s);setTimeout(()=>{if(!d){end();no()}},15000)})}
let CART={},PRODS=[],NOTE='';
async function openOrder(){const b=$('orderBox');b.innerHTML='<div class="state">Carregando produtos...</div>';b.scrollIntoView({behavior:'smooth'});try{const r=await call('action=ps_products');if(!r.ok)throw 0;PRODS=r.products;CART={};NOTE='';drawOrder()}catch(e){b.innerHTML='<div class="state">Não foi possível carregar os produtos.</div>'}}
function chg(id,n){const pr=PRODS.find(x=>x.id===id),lim=pr&&pr.stock!=null?pr.stock:50;CART[id]=Math.max(0,Math.min(lim,(CART[id]||0)+n));drawOrder()}
function stk(p){return p.stock==null?'':p.stock<=0?'':p.stock<=5?' · Últimas '+p.stock+' un.':' · '+p.stock+' disponíveis'}
function drawOrder(){const total=PRODS.reduce((s,p)=>s+(CART[p.id]||0)*p.price,0),qty=Object.values(CART).reduce((a,b)=>a+b,0);
 $('orderBox').innerHTML='<h2>Fazer pedido</h2>'+PRODS.map(p=>`<div class="order" style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 15px"><div><b>${esc(p.name)}</b><small>${money(p.price)}${stk(p)}</small></div>${p.stock===0?'<span class="tag warn">Esgotado</span>':`<div class="step"><button onclick="chg(${p.id},-1)">−</button><span>${CART[p.id]||0}</span><button onclick="chg(${p.id},1)">+</button></div>`}</div>`).join('')+`<textarea id="oNote" rows="2" placeholder="Observação (ex.: retirar às 14h)" oninput="NOTE=this.value">${esc(NOTE)}</textarea><button class="go" id="sendBtn" ${qty?'':'disabled'} onclick="sendOrder()">Enviar pedido · ${money(total)}</button>`}
async function sendOrder(){const items=PRODS.filter(p=>CART[p.id]>0).map(p=>({p:p.id,q:CART[p.id]}));if(!items.length)return;const b=$('sendBtn');b.disabled=true;b.textContent='Enviando...';
 try{const r=await call('action=ps_order&items='+encodeURIComponent(JSON.stringify(items))+'&note='+encodeURIComponent(NOTE));if(!r.ok)throw new Error(r.error||'');$('orderBox').innerHTML='<div class="banner">✓ Pedido enviado! Assim que o Açaí Obrigatório confirmar, ele aparece em “Meus pedidos”.</div>'}
 catch(e){alert(e.message==='limit'?'Você já tem pedidos aguardando confirmação.':e.message==='stock'?'Algum item esgotou ou ficou com menos unidades. Vamos atualizar a lista.':'Não foi possível enviar. Tente de novo.');e.message==='stock'?openOrder():drawOrder()}}
let QUOTES=[];
async function loadQuotes(){try{const r=await call('action=pq_list');if(r&&r.ok){QUOTES=r.quotes||[];drawQuotes()}}catch(e){}}
function qt(q){const sub=(q.items||[]).reduce((s,i)=>s+(+i.qty||0)*(+i.price||0),0),total=Math.max(0,sub-(+q.discount||0)+(+q.fee||0));return {total,dep:total*(+q.depositPct||0)/100}}
function drawQuotes(){const el=$('quotesBox');if(!el)return;if(!QUOTES.length){el.innerHTML='';return}
 el.innerHTML='<h2>Meus orçamentos</h2>'+QUOTES.slice().sort((a,b)=>b.id-a.id).map(q=>{const t=qt(q),end=new Date(new Date(q.createdAt).getTime()+(+q.validDays||7)*864e5),exp=q.status==='Enviado'&&Date.now()>end.getTime(),st=exp?'Expirado':q.status,ok=st==='Aprovado',num='ORC-'+String(q.id).padStart(4,'0'),ev=q.eventDate?new Date(q.eventDate+'T12:00').toLocaleDateString('pt-BR'):'';
 return `<details class="order" open><summary><div><b>${num}</b><small>${ev?'Evento em '+ev:'Sem data definida'}${q.place?' · '+esc(q.place):''}</small><span class="tag ${ok?'':'warn'}">${st==='Enviado'?'Aguardando sua resposta':st}</span></div><b>${money(t.total)}</b></summary><div class="det">${(q.items||[]).map(i=>'• '+(+i.qty)+'x '+esc(i.name)+' · '+money(i.price)).join('<br>')}${q.fee>0?'<br>• Entrega/montagem · '+money(q.fee):''}${q.discount>0?'<br>• Desconto − '+money(q.discount):''}<br><br>Sinal para reservar: <b>${money(t.dep)}</b>${st==='Enviado'?'<br>Válido até '+end.toLocaleDateString('pt-BR'):''}${st==='Enviado'?`<div class="acts"><button class="go" onclick="answerQuote(${q.id},'Aprovado')">✓ Aprovar</button><button class="wa" style="background:var(--line);color:var(--ink);border:0" onclick="answerQuote(${q.id},'Recusado')">Recusar</button></div>`:''}${ok?`<div class="banner" style="margin-top:10px">✓ Aprovado! Para garantir a data, faça o sinal e <a style="color:inherit;text-decoration:underline" href="https://wa.me/${WA}?text=${encodeURIComponent('Olá! Aprovei o orçamento '+num+'.')}" target="_blank" rel="noopener">avise no WhatsApp</a>.</div>`:''}</div></details>`}).join('')}
async function answerQuote(id,ans){const q=QUOTES.find(x=>x.id===id);if(!q)return;const t=qt(q);if(!confirm(ans==='Aprovado'?'Aprovar este orçamento de '+money(t.total)+'? O sinal de '+money(t.dep)+' garante a data.':'Recusar este orçamento?'))return;
 try{const r=await call('action=pq_answer&id='+id+'&answer='+ans);if(!r.ok)throw new Error(r.error||'');await loadQuotes()}catch(e){alert(e.message==='expired'?'Este orçamento expirou. Peça um novo pelo WhatsApp.':'Não foi possível enviar sua resposta. Tente de novo.')}}
const PCACHE='acai_portal_prods_'+TOKEN.slice(0,8);let PREADY=false,LAST=0;
try{const c=JSON.parse(localStorage.getItem(PCACHE)||'null');if(c&&c.length)PRODS=c}catch(e){}
function prefetchProducts(){return call('action=ps_products').then(r=>{if(r&&r.ok){PRODS=r.products;PREADY=true;try{localStorage.setItem(PCACHE,JSON.stringify(PRODS))}catch(e){}drawOrder()}}).catch(()=>{})}
function ensureSheet(){if($('sheet'))return;const d=document.createElement('div');d.id='sheet';d.className='sheet';d.onclick=e=>{if(e.target===d)closeOrder()};d.innerHTML='<div class="sheetBox"><div class="sheetHead"><div><h3>Fazer pedido</h3><span id="sheetSub">Escolha seus produtos</span></div><button class="sx" onclick="closeOrder()">×</button></div><div class="sheetBody"><div id="plist"></div><textarea id="oNote" rows="2" placeholder="Observação (ex.: retirar às 14h)" oninput="NOTE=this.value"></textarea></div><div class="sheetFoot"><div><small>Total</small><b id="oTotal">R$ 0,00</b></div><button class="go" id="sendBtn" onclick="sendOrder()" disabled>Escolha um item</button></div></div>';document.body.appendChild(d)}
function openOrder(){ensureSheet();$('oNote').value=NOTE;requestAnimationFrame(()=>$('sheet')?.classList.add('open'));document.body.style.overflow='hidden';drawOrder();if(!PREADY)prefetchProducts()}
function closeOrder(){const s=$('sheet');if(!s)return;s.classList.remove('open');document.body.style.overflow='';setTimeout(()=>s.remove(),350)}
function chg(id,n){const pr=PRODS.find(x=>x.id===id),lim=pr&&pr.stock!=null?pr.stock:50;CART[id]=Math.max(0,Math.min(lim,(CART[id]||0)+n));LAST=id;drawOrder()}
function drawOrder(){const L=$('plist');if(!L)return;$('sheetSub').textContent=PREADY?'Escolha seus produtos':'Atualizando disponibilidade...';
 if(!PRODS.length){L.innerHTML='<div class="sk"></div><div class="sk"></div><div class="sk"></div>';return}
 let total=0,qty=0;
 L.innerHTML=PRODS.map(p=>{const n=CART[p.id]||0;total+=n*p.price;qty+=n;const out=p.stock===0,hint=p.stock==null||out?'':p.stock<=5?' · Últimas '+p.stock+' un.':' · '+p.stock+' disponíveis';
  return `<div class="prow ${n?'on':''} ${out?'out':''}"><div><b>${esc(p.name)}</b><small>${money(p.price)}${hint}${p.noPts?' · não soma pontos':''}</small></div>${out?'<span class="tag warn">Esgotado</span>':`<div class="step"><button onclick="chg(${p.id},-1)">−</button><span class="${LAST===p.id?'bump':''}">${n}</span><button onclick="chg(${p.id},1)">+</button></div>`}</div>`}).join('');
 $('oTotal').textContent=money(total);const b=$('sendBtn');b.disabled=!qty;b.textContent=qty?'Enviar pedido':'Escolha um item';LAST=0}
async function sendOrder(){const items=PRODS.filter(p=>CART[p.id]>0).map(p=>({p:p.id,q:CART[p.id]}));if(!items.length)return;const b=$('sendBtn');b.disabled=true;b.textContent='Enviando...';
 try{const r=await call('action=ps_order&items='+encodeURIComponent(JSON.stringify(items))+'&note='+encodeURIComponent(NOTE));if(!r.ok)throw new Error(r.error||'');
  $('sheet').querySelector('.sheetBox').innerHTML='<div class="done"><div class="check">✓</div><h3 style="margin:0 0 6px;font-size:22px">Pedido enviado!</h3><p style="color:var(--mute);margin:0 0 20px">Assim que o Açaí Obrigatório confirmar, ele aparece em “Meus pedidos”.</p><button class="go" style="width:100%" onclick="closeOrder()">Fechar</button></div>';CART={};NOTE=''}
 catch(e){alert(e.message==='limit'?'Você já tem pedidos aguardando confirmação.':e.message==='stock'?'Algum item esgotou ou ficou com menos unidades. Vamos atualizar a lista.':'Não foi possível enviar. Tente de novo.');if(e.message==='stock'){PREADY=false;prefetchProducts()}b.disabled=false;drawOrder()}}
(function(){
 const t=TOKEN;
 if(!t)return fail('Link incompleto','Peça um novo link ao Açaí Obrigatório.');
 const cb='__portal_'+Date.now(),s=document.createElement('script');let done=false;
 const end=()=>{done=true;try{delete window[cb];s.remove()}catch(e){}};
 window[cb]=d=>{end();d&&d.ok?render(d):fail('Cliente não encontrado','Confira o link enviado pelo Açaí Obrigatório.')};
 s.onerror=()=>{end();fail('Não foi possível carregar','Verifique sua internet e abra o link de novo.')};
 s.src=API+'?action=portal&token='+encodeURIComponent(t)+'&callback='+cb+'&t='+Date.now();document.body.appendChild(s);
 setTimeout(()=>{if(!done){end();fail('Demorou para responder','Tente abrir o link novamente em instantes.')}},12000);
})();
</script></body></html>
